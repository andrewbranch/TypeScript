<text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328">The script body appears twice in the virtual file, so the rename request projects to both copies.</text>
<text x="16" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328">Each copy yields edits for both occurrences of <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">n</tspan>. All four map back to the same two original ranges and are deduplicated.</text>
