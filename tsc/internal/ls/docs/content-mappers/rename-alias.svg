<text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">Rename skips occurrences that are not exact</text>
<text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328">Renaming <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">XCounter</tspan> finds two virtual occurrences. The import is verbatim, so its edit maps exactly.</text>
<text x="16" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328">The call maps through an alias segment (<tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">x-counter</tspan>), which has Atom fidelity; that occurrence is skipped.</text>
<text x="80" y="124" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8c959f">original</text>
