<text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">Completions use only the first projection, which must be Exact</text>
<text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328">The cursor projects into both copies, but only the first is used. The replacement span <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">na</tspan> maps Exact,</text>
<text x="16" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328">so each completion item can replace it; an item whose span did not map exactly would be dropped.</text>
