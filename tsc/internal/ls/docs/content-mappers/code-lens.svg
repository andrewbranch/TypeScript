<text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">A code lens range must be fully covered</text>
<text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328">The mapper injects <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">track();</tspan> into <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">f</tspan>. The lens range for <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">f</tspan> now includes synthesized text and maps None,</text>
<text x="16" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328">so <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">f</tspan> gets no lens. <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">g</tspan> is entirely verbatim and keeps its lens.</text>
<text x="80" y="124" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8c959f">original</text>
