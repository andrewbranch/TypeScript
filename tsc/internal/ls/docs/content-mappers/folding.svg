<text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328">The mapper wraps the script in a synthesized function. That function's body would fold, but its braces are</text>
<text x="16" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328">synthesized, so the range maps None. The <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">if</tspan> block is verbatim and folds as usual.</text>
